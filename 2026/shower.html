<html>

<head>
	<title>Future Turtles 2025 - Burning Man Theme Camp</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="/assets/css/main.css" />
	<link rel="stylesheet" href="/assets/css/futureturtles.css" />

	<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
	<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
	<link rel="shortcut icon" href="/favicon/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
	<link rel="manifest" href="/favicon/site.webmanifest" />

<body class="is-preload">

	<!-- Wrapper -->
	<div id="wrapper">

		<!-- Header -->
		<script src="/nav-header.js"></script>

		<!-- Main -->
		<div id="main">

			<!-- Content -->
			<section class="main">
				<div class="inner">

					<header class="major">
						<span class="category">Future Turtles Theme Camp</span>
						<h2>Shower Design 2026</h2>
					</header>

					<p>(Right drag to pan, left drag to orbit)</p>

					<model-viewer src="shower.glb" alt="Shower Model" camera-controls auto-rotate
						environment-image="neutral" style="width:90vw; height:70vh;">
					</model-viewer>



				</div>
			</section>


			<!-- Footer -->
			<script src="/nav-footer.js"></script>

		</div>

		<!-- Scripts -->
		<script src="/assets/js/jquery.min.js"></script>
		<script src="/assets/js/jquery.dropotron.min.js"></script>
		<script src="/assets/js/browser.min.js"></script>
		<script src="/assets/js/breakpoints.min.js"></script>
		<script src="/assets/js/util.js"></script>
		<script src="/assets/js/main.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-element-bundle.min.js"></script>
		<script>
			document.addEventListener('DOMContentLoaded', function () {
				const zoomButton = document.getElementById('zoomButton');
				const swiperContainer = document.getElementById('swiperContainer');

				// Handle the click event for the zoom button
				zoomButton.addEventListener('click', () => { swiperContainer.requestFullscreen(); });;

			});
		</script>
